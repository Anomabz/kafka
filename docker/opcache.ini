; `php artisan serve` menjalankan PHP lewat SAPI CLI, dan di CLI opcache
; default-nya mati (opcache.enable_cli=0). Akibatnya setiap request
; meng-compile ulang seluruh file Laravel. Dinyalakan di sini supaya
; bytecode-nya dipakai ulang selama proses server hidup.
opcache.enable=1
opcache.enable_cli=1

opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; File aplikasi datang dari bind mount dan bisa berubah tanpa restart
; container, jadi timestamp tetap dicek — cuma tidak setiap request.
opcache.validate_timestamps=1
opcache.revalidate_freq=60

; Jangan bocorkan versi PHP persis lewat header X-Powered-By -- memudahkan
; penyerang menyasar CVE spesifik versi itu.
expose_php=0
