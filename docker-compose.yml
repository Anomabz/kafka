services:
  app:
    build:
      context: .
    ports:
      - "8020:8000"
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      # Diubah ke mysql dan diarahkan ke service db
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: sapto_db
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
      DB_TIMEOUT: "${DB_TIMEOUT:-5}"
      SESSION_DRIVER: "${SESSION_DRIVER:-file}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-sync}"
      CACHE_STORE: "${CACHE_STORE:-file}"
      PANGKALAN_DATA_BASE_URL: "${PANGKALAN_DATA_BASE_URL:-https://pangkalan-data.unsri.ac.id}"
      PANGKALAN_DATA_EMAIL: "${PANGKALAN_DATA_EMAIL:-}"
      PANGKALAN_DATA_PASSWORD: "${PANGKALAN_DATA_PASSWORD:-}"
      PANGKALAN_DATA_TIMEOUT: "${PANGKALAN_DATA_TIMEOUT:-30}"
      PANGKALAN_DATA_CONNECT_TIMEOUT: "${PANGKALAN_DATA_CONNECT_TIMEOUT:-10}"
      PANGKALAN_DATA_CACHE_TTL: "${PANGKALAN_DATA_CACHE_TTL:-3600}"
      PANGKALAN_DATA_TOKEN_CACHE_TTL: "${PANGKALAN_DATA_TOKEN_CACHE_TTL:-3300}"
      SAPTO_PERGURUAN_TINGGI_KEYWORD: "${SAPTO_PERGURUAN_TINGGI_KEYWORD:-Universitas Sriwijaya}"
      SAPTO_API_PRODI_MAX_PAGES: "${SAPTO_API_PRODI_MAX_PAGES:-100}"
      SAPTO_API_DATA_MAX_PAGES: "${SAPTO_API_DATA_MAX_PAGES:-10}"
      SAPTO_API_ACTIVITY_LOOKUP_LIMIT: "${SAPTO_API_ACTIVITY_LOOKUP_LIMIT:-600}"
      SAPTO_API_ACTIVITY_POOL_SIZE: "${SAPTO_API_ACTIVITY_POOL_SIZE:-20}"
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: sapto_db
      MYSQL_ROOT_PASSWORD: rootpassword
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - "8085:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      - db

volumes:
  mysql_data:
