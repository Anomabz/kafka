# Nama project dikunci supaya tidak ikut nama folder. Tanpa ini, repo yang
# dipindah dari /home/sapto/sapto-prod ke /home/sapto/SAPTO (2026-09-11) jadi
# project baru "sapto" dengan volume db terpisah yang basi, sementara data
# asli tetap di volume sapto-prod_mysql_data. Semua script docker/*.sh dan
# cron ikut nama ini.
name: sapto-prod

services:
  app:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "8020:8000"
    volumes:
      - .:/var/www/html
    environment:
      # Default aman (production, debug off) -- lihat riwayat: .env sendiri
      # sempat diubah ke production/false tapi env var compose di sini
      # menang atas .env (Symfony Dotenv tidak menimpa env var yang sudah
      # ada), jadi APP_DEBUG=true tetap aktif walau .env sudah benar.
      # Override lewat .env di root project ini (bukan .env Laravel) kalau
      # perlu debug mode sementara.
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      RUN_MIGRATIONS: "${RUN_MIGRATIONS:-true}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: sapto_db
      DB_USERNAME: root
      DB_PASSWORD: rootpassword
      DB_TIMEOUT: "${DB_TIMEOUT:-5}"
      SESSION_DRIVER: "${SESSION_DRIVER:-file}"
      # 'database': sinkronisasi PD UNSRI (SyncPdUnsriTableJob) jalan lama dan
      # harus di latar belakang lewat queue:work (lihat docker/entrypoint.sh),
      # bukan blocking di request HTTP seperti 'sync'.
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-database}"
      CACHE_STORE: "${CACHE_STORE:-file}"
      PANGKALAN_DATA_BASE_URL: "${PANGKALAN_DATA_BASE_URL:-https://pangkalan-data.unsri.ac.id}"
      PANGKALAN_DATA_EMAIL: "${PANGKALAN_DATA_EMAIL:-}"
      PANGKALAN_DATA_PASSWORD: "${PANGKALAN_DATA_PASSWORD:-}"
      PANGKALAN_DATA_TIMEOUT: "${PANGKALAN_DATA_TIMEOUT:-30}"
      PANGKALAN_DATA_CONNECT_TIMEOUT: "${PANGKALAN_DATA_CONNECT_TIMEOUT:-10}"
      PANGKALAN_DATA_CACHE_TTL: "${PANGKALAN_DATA_CACHE_TTL:-3600}"
      PANGKALAN_DATA_TOKEN_CACHE_TTL: "${PANGKALAN_DATA_TOKEN_CACHE_TTL:-3300}"
      SAPTO_PERGURUAN_TINGGI_KEYWORD: "${SAPTO_PERGURUAN_TINGGI_KEYWORD:-Universitas Sriwijaya}"
      SAPTO_API_PRODI_MAX_PAGES: "${SAPTO_API_PRODI_MAX_PAGES:-100}"
      SAPTO_API_DATA_MAX_PAGES: "${SAPTO_API_DATA_MAX_PAGES:-10}"
      SAPTO_API_ACTIVITY_LOOKUP_LIMIT: "${SAPTO_API_ACTIVITY_LOOKUP_LIMIT:-600}"
      SAPTO_API_ACTIVITY_POOL_SIZE: "${SAPTO_API_ACTIVITY_POOL_SIZE:-20}"
      # Kafka lewat REST Proxy (lihat config/kafka.php dan docs/kafka.md).
      KAFKA_REST_URL: "${KAFKA_REST_URL:-http://kafka-rest:8082}"
    # Sengaja TIDAK bergantung pada kafka/kafka-rest: Kafka pelengkap (arsip
    # event & audit), dan event yang gagal terkirim ditampung outbox. Kalau
    # depends_on ke sana, broker yang bermasalah ikut menahan aplikasi utama.
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - frontend

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # Pintu HTTP ke Kafka untuk aplikasi (produce/consume/admin). Tanpa port
  # host: hanya container di network compose ini yang boleh memakainya.
  # Dipakai karena image app (composer:2 Alpine) tidak punya ekstensi rdkafka.
  kafka-rest:
    image: confluentinc/cp-kafka-rest:7.5.0
    restart: unless-stopped
    depends_on:
      - kafka
    environment:
      KAFKA_REST_HOST_NAME: kafka-rest
      KAFKA_REST_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      KAFKA_REST_LISTENERS: http://0.0.0.0:8082
      # Server ini sempit RAM (banyak project compose); default JVM terlalu boros.
      KAFKA_REST_HEAP_OPTS: "-Xms128m -Xmx256m"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8082/topics >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Antarmuka web untuk melihat topic/pesan. Sekarang memakai login dan hanya
  # mendengarkan di localhost: dulu terbuka tanpa password di jaringan kampus
  # (10.8.5.67:8088). Akses dari laptop lewat SSH tunnel:
  #   ssh -L 8088:127.0.0.1:8088 <user>@<server>   lalu buka http://localhost:8088
  # Sandi ada di .env (KAFKA_UI_PASSWORD). Halaman ringkasan yang lebih
  # mudah dibaca ada di SAPTO: Admin -> Event Stream (Kafka).
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      AUTH_TYPE: LOGIN_FORM
      SPRING_SECURITY_USER_NAME: "${KAFKA_UI_USER:-admin}"
      SPRING_SECURITY_USER_PASSWORD: "${KAFKA_UI_PASSWORD}"
    depends_on:
      - kafka

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: sapto_db
      MYSQL_ROOT_PASSWORD: rootpassword
    # start_period longgar: db ini ~2GB, InnoDB/XA recovery setelah reboot
    # kotor pernah butuh ~90 detik sebelum menerima koneksi.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    # Sengaja tidak publish port ke host: 3306/3307/3308/3309 sudah dipakai
    # container project lain yang restart:always, jadi setiap reboot db ini
    # kalah rebutan port dan mati (exit 255). app & phpmyadmin cukup lewat
    # network compose. Akses dari host: pakai phpmyadmin di :8086.
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    restart: always
    ports:
      - "127.0.0.1:8087:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:

networks:
  default: {}
  frontend:
    external: true
