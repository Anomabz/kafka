name: Sapto Production Deployment Pipeline

on:
  push:
    branches:
      - dev-prod

jobs:
  deploy-production:
    runs-on: ubuntu-latest

    steps:
      # 1. Pasang cloudflared menggunakan modul instan (Anti-Gagal)
      - name: Install Cloudflare Client
        uses: cloudflare/cloudflare-service-action@v1
        with:
          version: 'latest'

      # 2. Beritahu SSH GitHub agar melewatkan koneksi ke domain Paduka melalui cloudflared
      - name: Configure SSH for Cloudflare Tunnel
        run: |
          mkdir -p ~/.ssh
          echo "Host ${{ secrets.SSH_HOST }}" >> ~/.ssh/config
          echo "  ProxyCommand /usr/bin/cloudflared access ssh --hostname %h" >> ~/.ssh/config

      # 3. Jalankan deploy ke server kampus Paduka
      - name: Koneksi ke Server dan Update Folder sapto-prod
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            cd /home/sapto/sapto-prod
            git pull origin dev-prod --no-rebase
            docker compose up -d --build
            docker compose exec -T app npm install
            docker compose exec -T app npm run build