name: Sapto Production Deployment Pipeline

# 1. Robot ini HANYA akan berjalan saat Paduka melakukan PUSH ke branch dev-prod
on:
  push:
    branches:
      - dev-prod

jobs:
  deploy-production:
    runs-on: ubuntu-latest

    steps:
      # 2. Menghubungkan GitHub ke server sapto-dev-servers via SSH
      - name: Koneksi ke Server dan Update Folder sapto-prod
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          script: |
            # Masuk ke folder produksi yang tertera di gambar server Paduka
            cd /home/sapto/sapto-prod
            
            # Tarik kode spesifik dari branch dev-prod
            git pull origin dev-prod --no-rebase
            
            # Bangun ulang container Docker produksi secara background
            docker compose up -d --build
            
            # Jalankan instalasi dependensi dan build aset frontend Laravel di dalam container
            docker compose exec -T app npm install
            docker compose exec -T app npm run build